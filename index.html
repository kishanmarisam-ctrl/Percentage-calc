<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Precision Percents</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #3b82f6;
            --primary-soft: #eff6ff;
            --border: #e2e8f0;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            padding: 32px 24px 8px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0f172a;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .content {
            padding: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        input, select {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: #fdfdfd;
            font-size: 16px;
            color: var(--text-main);
            transition: all 0.2s ease;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        #result-area {
            display: none;
            margin-top: 12px;
            padding: 24px;
            background: var(--primary-soft);
            border-radius: var(--radius);
            border: 1px solid rgba(59, 130, 246, 0.1);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #475569;
        }

        .divider {
            margin: 16px 0;
            height: 1px;
            background: rgba(59, 130, 246, 0.2);
        }

        .total-display {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .total-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
        }

        .total-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .placeholder {
            text-align: center;
            padding: 40px 20px;
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>PercentCalc</h1>
            <p>Smart math for daily use</p>
        </div>

        <div class="content">
            <div class="input-group">
                <label for="base">Base Number</label>
                <input type="number" id="base" placeholder="Enter amount" step="any" inputmode="decimal" autofocus>
            </div>

            <div class="grid">
                <div class="input-group">
                    <label for="percent">Percentage (%)</label>
                    <input type="number" id="percent" placeholder="%" step="any" inputmode="decimal">
                </div>
                <div class="input-group">
                    <label for="op">Action</label>
                    <select id="op">
                        <option value="add">Add %</option>
                        <option value="sub">Subtract %</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="extra">Extra Number (+)</label>
                <input type="number" id="extra" placeholder="Optional" step="any" inputmode="decimal">
            </div>

            <div id="placeholder" class="placeholder">
                Enter values to calculate
            </div>

            <div id="result-area">
                <div class="result-row">
                    <span>Percent Amount</span>
                    <strong id="res-perc">0</strong>
                </div>
                <div class="result-row">
                    <span id="label-op">Adjusted Base</span>
                    <strong id="res-adj">0</strong>
                </div>
                <div class="divider"></div>
                <div class="total-display">
                    <div class="total-label">Final Result</div>
                    <div class="total-value" id="res-total">0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Element selectors
            const baseInput = document.getElementById('base');
            const percInput = document.getElementById('percent');
            const opSelect = document.getElementById('op');
            const extraInput = document.getElementById('extra');
            
            const resultArea = document.getElementById('result-area');
            const placeholder = document.getElementById('placeholder');
            
            const resPerc = document.getElementById('res-perc');
            const resAdj = document.getElementById('res-adj');
            const resTotal = document.getElementById('res-total');
            const labelOp = document.getElementById('label-op');

            /**
             * Formats numbers conditionally:
             * Whole number -> no decimals
             * Not a whole number -> exactly two decimals
             */
            function format(num) {
                if (Number.isInteger(num)) {
                    return num.toString();
                } else {
                    return num.toFixed(2);
                }
            }

            /**
             * Performs calculation and updates UI.
             * Does NOT copy to clipboard automatically on input.
             */
            function calculate() {
                const baseValue = parseFloat(baseInput.value);
                const percentValue = parseFloat(percInput.value);
                const extraValue = parseFloat(extraInput.value) || 0;
                const mode = opSelect.value;

                if (isNaN(baseValue) || isNaN(percentValue)) {
                    resultArea.style.display = 'none';
                    placeholder.style.display = 'block';
                    return null;
                }

                const percAmt = baseValue * (percentValue / 100);
                const adjBase = mode === 'add' ? baseValue + percAmt : baseValue - percAmt;
                const total = adjBase + extraValue;

                // Update text displays with conditional formatting
                const formattedResult = format(total);
                resPerc.textContent = format(percAmt);
                resAdj.textContent = format(adjBase);
                resTotal.textContent = formattedResult;
                labelOp.textContent = mode === 'add' ? 'Base + Percent' : 'Base - Percent';

                // Display logic
                placeholder.style.display = 'none';
                resultArea.style.display = 'block';

                return formattedResult;
            }

            /**
             * Safe clipboard copy function.
             */
            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        navigator.clipboard.writeText(text);
                    } catch (err) {
                        // Silent fail - app stability priority
                    }
                }
            }

            // Real-time calculation on any input change
            [baseInput, percInput, opSelect, extraInput].forEach(el => {
                el.addEventListener('input', calculate);
            });

            // Focus management and manual trigger logic for Enter key
            baseInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    percInput.focus();
                }
            });

            percInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    // Always trigger calculation for UI update
                    const numericResult = calculate();
                    const percVal = percInput.value;
                    
                    if (numericResult !== null && percVal !== "") {
                        // Copy generated text string: <ANSWER> with <PERCENTAGE>% off coupon
                        const textToCopy = numericResult + " with " + percVal + "% off coupon";
                        copyToClipboard(textToCopy);
                    }
                }
            });

            // Initial calculate to check state
            calculate();
        })();
    </script>
</body>
</html>
